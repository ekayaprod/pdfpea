      <nav>

                width="250"
                height="69"
                loading="lazy"
                decoding="async"
              />
            </div>
          </div>
        </div>
      </nav>
    </section>

    <!-- PDF Editor Section -->
    <section id="editor" class="py-6 bg-gray-50 h-screen flex flex-col">
      <div class="max-w-10xl mx-auto px-4 sm:px-6 lg:px-8 w-full flex-grow flex flex-col">
        <!-- Vue PDF Editor App -->
        <div class="bg-white rounded-2xl shadow-xl overflow-hidden flex-grow flex flex-col min-h-0">
          <div

            class="h-full w-full flex-grow flex flex-col relative"
            style="min-height: 80vh"
          ></div>
        </div>
      </div>
    </section>

      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

          </p>
          <div class="flex space-x-4 mt-4 md:mt-0">

              class="text-gray-400 hover:text-white transition-colors"
              title="GitHub"
            >

            </a>
          </div>
        </div>
      </div>

      class="fixed inset-0 bg-blue-600 bg-opacity-90 backdrop-blur-sm hidden z-50 flex items-center justify-center"

        <h3 class="text-2xl font-bold mb-2">Drop your PDF here</h3>
        <p class="text-blue-200">Release to start editing</p>

    </div>

      // Set current year dynamically
      document.getElementById("current-year").textContent = new Date().getFullYear();
